schema: spec-driven

# Короткий контекст для ИИ-помощника. Подробности — openspec/project.md.
context: |
  IT-Office — idle-тайкун в Telegram Mini App (TypeScript, Vite 6, PixiJS 8, HTML-интерфейс, vitest).
  Хостинг только GitHub Pages, сервера и БД нет: сохранения в localStorage и Telegram CloudStorage.
  Отделы по порядку: сисадмины (0), поддержка (1), аналитики (2), разработка (3), тестирование (4).
  Порядок открытия: сисадмины → поддержка → директор IT → зона отдыха → аналитики → туалет → разработка → тестирование.
  Камера — изометрия 2:1, офис 3×3 с полем вокруг.
  Код игры: src/game (логика, без графики), src/scene (Pixi), src/ui (DOM), sim (симулятор).

rules:
  proposal:
    - Писать по-русски.
    - Указывать, какие спеки из openspec/specs меняются и нужно ли обновить docs/GDD.md и копию GDD в Claude Docs.
  tasks:
    - Последние задачи всегда: тесты и типы, симулятор при изменении экономики, обновление спек и GDD, push в main от apelsinchikov без трейлеров.
  specs:
    - Требования формулировать проверяемо, с числами из кода (economy.ts, config.ts, director.ts).
